{% set name = "ls-hpack" %}
{% set version = "2.3.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/litespeedtech/ls-hpack/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 430a1a36029e0ae1c81eaa0b2356920f1e65fde1cdd722351c671ebe513b7a96

build:
  number: 0
  # build.sh installs a Unix shared library (.dylib/.so); no Windows install path upstream.
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja-base

test:
  commands:
    - test -f ${PREFIX}/lib/libls-hpack${SHLIB_EXT}
    - test -f ${PREFIX}/include/lshpack.h
    - test -f ${PREFIX}/include/lsxpack_header.h

about:
  home: https://github.com/litespeedtech/ls-hpack
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: LiteSpeed HPACK (RFC7541) Library
  description: |
    LS-HPACK provides functionality to encode and decode HTTP headers using
    HPACK compression mechanism specified in RFC 7541.
  doc_url: https://github.com/litespeedtech/ls-hpack
  dev_url: https://github.com/litespeedtech/ls-hpack

extra:
  recipe-maintainers:
    - pavelzw
