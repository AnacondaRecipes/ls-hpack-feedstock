{% set name = "ls-hpack" %}
{% set version = "2.3.5" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/litespeedtech/ls-hpack/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 430a1a36029e0ae1c81eaa0b2356920f1e65fde1cdd722351c671ebe513b7a96

build:
  number: 0
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x.x') }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja-base

test:
  commands:
    - test -f ${PREFIX}/lib/libls-hpack${SHLIB_EXT}  # [unix]
    - test -f ${PREFIX}/include/lshpack.h  # [unix]
    - test -f ${PREFIX}/include/lsxpack_header.h  # [unix]
    - if not exist %LIBRARY_BIN%\ls-hpack.dll exit 1  # [win]
    - if not exist %LIBRARY_LIB%\ls-hpack.lib exit 1  # [win]
    - if not exist %LIBRARY_INC%\lshpack.h exit 1  # [win]
    - if not exist %LIBRARY_INC%\lsxpack_header.h exit 1  # [win]

about:
  home: https://github.com/litespeedtech/ls-hpack
  license: MIT
  license_family: OTHER
  license_file:
    - LICENSE
    - deps/xxhash/xxhash.h
  summary: LiteSpeed HPACK (RFC7541) Library
  description: |
    LS-HPACK provides functionality to encode and decode HTTP headers using
    HPACK compression mechanism specified in RFC 7541.
  doc_url: https://github.com/litespeedtech/ls-hpack
  dev_url: https://github.com/litespeedtech/ls-hpack

extra:
  recipe-maintainers:
    - pavelzw
